name: ECO Tcl regression

on:
  push:
    paths:
      - "eco/**"
      - "flow/config.tcl"
      - "tests/**"
      - ".github/workflows/eco-tcl-regression.yml"
  pull_request:
    paths:
      - "eco/**"
      - "flow/config.tcl"
      - "tests/**"
      - ".github/workflows/eco-tcl-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eco-preflight:
    name: ECO preflight regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tcl
        run: |
          sudo apt-get update
          sudo apt-get install --yes tcl

      - name: Run preflight regression
        run: tclsh tests/test_eco_preflight.tcl

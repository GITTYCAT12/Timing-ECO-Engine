<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900"><rect width="1400" height="1900" fill="#0b0f14"/><style>.title{font:700 34px Arial;fill:#fff}.h{font:700 24px Arial;fill:#8be9fd}.t{font:18px monospace;fill:#f8f8f2}.g{font:18px monospace;fill:#50fa7b}.muted{font:16px Arial;fill:#b8c0cc}.box{fill:#111820;stroke:#394452;stroke-width:2}</style><text x="60" y="60" class="title">Timing-ECO-Engine — Development Evidence</text><text x="60" y="95" class="muted">Cut-to-cut evidence: recommendation → baseline → implementation → validation → tests → ML</text><rect x="50" y="130" width="1300" height="260" rx="10" class="box"/><text x="75" y="170" class="h">1. ECO ACTION RANKING</text><text x="75" y="205" class="t">ECO Action        Target    Transformation                    Est. Saving   Score</text><text x="75" y="235" class="t">BUFFER_INSERTION  _6529_    DFFR_X1 → AUTO_REBUFFER             ~0.253 ns    0.25</text><text x="75" y="265" class="t">BUFFER_INSERTION  _3280_    INV_X1 → AUTO_REBUFFER              ~0.160 ns    0.09</text><text x="75" y="295" class="t">CELL_UPSIZING     _5084_    NOR2_X1 → NOR2_X2                   ~0.033 ns   -0.01</text><text x="75" y="325" class="t">CELL_UPSIZING     _5317_    OAI33_X1 → OAI33_X2                  ~0.033 ns   -0.01</text><text x="75" y="355" class="t">CELL_UPSIZING     _5323_    OAI33_X1 → OAI33_X2                  ~0.030 ns   -0.01</text><text x="75" y="382" class="muted">Meaning: the engine explains which physical change it proposes and why; savings are estimates.</text><rect x="50" y="415" width="1300" height="210" rx="10" class="box"/><text x="75" y="455" class="h">2. BASELINE TIMING</text><text x="75" y="500" class="t">baseline_wns.rpt → wns max  -1.66 ns</text><text x="75" y="535" class="t">baseline_tns.rpt → tns max -33.81 ns</text><text x="75" y="575" class="muted">Meaning: before the ECO, the worst setup margin is 1.66 ns short and the design has accumulated negative slack.</text><text x="75" y="602" class="muted">This is the starting point used to judge whether the ECO actually helped.</text><rect x="50" y="650" width="1300" height="390" rx="10" class="box"/><text x="75" y="690" class="h">3. CLOSED-LOOP VALIDATION — BEFORE vs AFTER</text><text x="75" y="735" class="t">Metric                 Baseline      Post-ECO       Outcome</text><text x="75" y="770" class="t">Worst Negative Slack   -1.660 ns     -1.200 ns      +0.460 ns (+27.7%)</text><text x="75" y="805" class="t">Total Negative Slack   -33.810 ns    -21.290 ns     +12.520 ns (+37.0%)</text><text x="75" y="840" class="t">Violating Setup Paths  50            0              50 resolved</text><text x="75" y="875" class="t">Worst Data Hold Slack  +0.040 ns     +0.040 ns      +0.000 ns</text><text x="75" y="910" class="t">Hold Signoff           baseline checked             PASSED SAFE</text><text x="75" y="950" class="t">Recovery/Removal       -0.090 ns     -0.090 ns      violated (no new regression)</text><text x="75" y="990" class="g">STATUS: ECO ACCEPTED — TIMING IMPROVED WITHOUT A DATA-HOLD VIOLATION</text><text x="75" y="1020" class="muted">Important: recovery/removal is an asynchronous check, not the normal data-path hold check.</text><rect x="50" y="1065" width="1300" height="270" rx="10" class="box"/><text x="75" y="1105" class="h">4. STRATEGY COMPARISON</text><text x="75" y="1145" class="t">Strategy                 Trials   Best ΔWNS   Best ΔTNS   Best Post Hold   Accepted</text><text x="75" y="1180" class="t">Greedy_WorstSlack           4       0.46       12.52          0.04             4</text><text x="75" y="1215" class="t">RuleBased_Heuristic         4       0.46       12.52          0.08             4</text><text x="75" y="1250" class="t">ECO_Copilot_Balanced        4       0.46       12.52          0.04             4</text><text x="75" y="1285" class="t">ECO_Copilot_HoldAware       4       0.46       12.52          0.08             4</text><text x="75" y="1315" class="muted">Meaning: multiple decision strategies were exercised rather than reporting only one hand-picked ECO.</text><rect x="50" y="1360" width="1300" height="210" rx="10" class="box"/><text x="75" y="1400" class="h">5. REGRESSION / INTEGRITY TESTS</text><text x="75" y="1440" class="t">python -m unittest discover tests -v</text><text x="75" y="1475" class="g">Ran 4 tests in 0.162s → OK</text><text x="75" y="1515" class="muted">Meaning: parser, ECO-type, Tcl-safety, and hold-vs-recovery/removal checks passed.</text><text x="75" y="1545" class="muted">These tests are there to stop implementation mistakes from being hidden by a good timing number.</text><rect x="50" y="1595" width="1300" height="250" rx="10" class="box"/><text x="75" y="1635" class="h">6. ML SCORING EVIDENCE</text><text x="75" y="1675" class="t">Random Forest trained on 16 independent closed-loop trials</text><text x="75" y="1710" class="t">Held-out timing MAE: 6.0033 ns (3.3 ps)   |   Train/Test: 12/4</text><text x="75" y="1745" class="t">Example candidate: fanout 75, load cap 159.54 pF</text><text x="75" y="1780" class="t">Prediction: ΔWNS ≈ 0.4561 ns, hold_safety_confidence = 1.0</text><text x="75" y="1820" class="muted">Transparency note: the displayed MAE line has a unit inconsistency; the underlying calculation should be rechecked.</text></svg>